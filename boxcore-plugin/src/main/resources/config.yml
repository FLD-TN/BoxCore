# BoxCore — configuration

# Do not change. Files without it (BoxCore 1.0.0) are backed up and replaced by the new defaults
config-version: 2
#
# Boost multipliers are whole numbers; a type with decimal: true also accepts one decimal, e.g. 1.5.
# Per player and type, with absent sources counted as 0:
#   R = rank permission  boxcore.boost.<type>.<n>, above 1 (e.g. boxcore.boost.mining.5, give it with LuckPerms).
#       Decimal types: boxcore.boost.<type>.<whole>_<digit>, e.g. boxcore.boost.quest.1_5 = x1.5 (a dot cannot be used)
#   B = the active personal bottle (at most one per type; a better bottle replaces the active one)
#   G = the global boost  /boxcore global start <type> <multiplier> <duration>
#   C = the boost of the player's clan (needs BoxClans): a clan bottle (/boxcore give ... clan) used by the
#       Minh Chủ or Phó Bang, or /clanadmin boost
#   effective = min( max(R + B, G, C, 1), max-multiplier )
# Rank and bottle add up; the global and the clan boost never add, they only win when they are higher.
# A bottle of the same multiplier as the running one adds its duration (up to max-duration); a lower one is refused.
#
# SECURITY: players without a staff rank must NOT have creative mode. A hacked creative client can craft
# items with arbitrary data, including boost bottles. Bottle data is re-validated against this file on
# every use, but only the limits below protect you from a crafted bottle.

# Boost types. A type only has an effect if some plugin asks BoxCore for it
# (mining: CataMines, quest: BoxQuest). Giving a bottle of an undeclared type is refused.
#   id              ^[a-z0-9_]{1,32}$
#   decimal         true: multipliers may have one decimal (x1.5, x2.5), smallest x1.1;
#                   false (default when missing): whole numbers only, smallest x2.
#                   mining stays false: CataMines only applies whole multipliers
#   max-multiplier  largest multiplier for bottles, global boosts and rank permissions, and the cap of the
#                   final effective value (rank + bottle is capped here). Whole number from 2 to 10000,
#                   or with decimal: true a number from 1.1 to 10000 with at most one decimal
#   max-duration    e.g. 30m, 12h, 1d, 1h30m
#   color           text colour of the type name in messages, bottle names and bossbar titles ('#RRGGBB')
#   bossbar-color   colour of the bar itself, only PINK, BLUE, RED, GREEN, YELLOW, PURPLE, WHITE exist
#                   (no orange or aqua: mining uses YELLOW, quest uses BLUE)
#   bottle-material item of this type's bottles; POTION is a water bottle. When missing: mining HONEY_BOTTLE,
#                   quest POTION, any other type bottle.material. Bottles always stack to 64
# Lowering max-multiplier or max-duration makes existing bottles above the new limit unusable (not consumed).
types:
  mining:
    display-name: 'Mining'
    description: 'Tăng x%multiplier% vật phẩm nhận được khi đào các khối'
    decimal: false
    max-multiplier: 100
    max-duration: 24h
    color: '#FFAA00'
    bossbar-color: YELLOW
    bottle-material: HONEY_BOTTLE
  quest:
    display-name: 'Quest'
    description: 'Tăng x%multiplier% phần thưởng nhận được khi hoàn thành nhiệm vụ (/quest)'
    decimal: true
    max-multiplier: 100
    max-duration: 24h
    color: '#55FFFF'
    bossbar-color: BLUE
    bottle-material: POTION

bottle:
  # Item material of the bottles of a type without bottle-material. Vanilla behaviour (throwing, drinking,
  # crafting, brewing, filling, placing...) is always blocked
  material: EXPERIENCE_BOTTLE
  # RIGHT or LEFT. Note: LEFT may be triggered accidentally during PvP (every swing is a left click)
  use-click: RIGHT
  # Minimum ticks between two uses by the same player (20 ticks = 1 second)
  use-cooldown-ticks: 10
  # A bottle is used at once only when the player has no active bottle of its type and it raises the multiplier.
  # Otherwise the first use only warns (messages.yml bottle.confirm-same / -higher / -lower / -no-effect) and the
  # bottle is consumed only if used a second time within this many seconds; after that the warning starts over.
  # Same or higher multiplier: replaces the active bottle (its remaining time is lost).
  # Lower or no effect: consumed without effect, the active bottle is kept
  confirm-window-seconds: 3
  # The type description in the bottle lore is wrapped onto several lines of at most this many characters
  # (breaking between words), 0 keeps it on one line
  description-width: 25
  # Sound played on a successful activation (a Minecraft sound key), '' disables it
  success-sound: 'entity.player.levelup'

# Decimal separator of displayed multipliers (x1.5 or x1,5), only '.' or ','.
# %boxcore_multiple_<type>_raw% always uses '.'
multiplier-decimal-separator: '.'

# How often rank permissions are re-read for online players, in seconds
permission-refresh-seconds: 10

# Timezone of displayed clock times (/boxcore check). Never the host's default timezone
timezone: 'Asia/Ho_Chi_Minh'

storage:
  # A save runs at most once every this many seconds after a change
  save-debounce-seconds: 5

# GEM: server currency, stored in plugins/BoxCore/gems.db (SQLite)
# It is NOT a Vault economy: the main money plugin keeps Vault. Commands: /gem, /gem pay, /gem top,
# /boxcore gem give|take|set|check. /gem pay needs the permission boxcore.gem.pay (grant it with LuckPerms)
gem:
  # Name shown in messages and placeholders, and its colour ('#RRGGBB')
  display-name: 'Gem'
  color: '#8245F8'
  # Balance of a player the first time BoxCore sees them
  starting-balance: 0
  # Largest balance a player can hold (at most 1000000000000)
  max-balance: 1000000000000
  pay:
    # Smallest amount for /gem pay
    min-amount: 1
    # Seconds between two successful /gem pay of the same player
    cooldown-seconds: 3
  top:
    # Number of players in /gem top and %boxcore_gem_top_<n>_...% (1..100)
    size: 10
    # How often the leaderboard is rebuilt, in seconds (at least 10)
    refresh-seconds: 60
    # Player names left out of the leaderboard (e.g. staff test accounts)
    exclude: []
  # Shown by the balance placeholders while a player is offline or not loaded yet
  placeholder-unknown: '-'
  # Transactions older than this many days are deleted on startup, 0 keeps them forever
  log-keep-days: 180

# Server-wide text style shared with the other in-house plugins
style:
  # Convert bossbar titles to small caps (a–z only; tags are never converted).
  # Chat messages and bottles always use the normal font
  small-caps: false
  palette:
    text: '#FFFFFF'
    muted: '#C8C8C8'
    accent: '#FFD166'
    success: '#55FF55'
    error: '#FF5555'
