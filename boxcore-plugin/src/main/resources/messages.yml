# BoxCore — messages

# Do not change. Files without it (BoxCore 1.0.0) are backed up and replaced by the new defaults
config-version: 2
#
# Palette tags: <text> <muted> <accent> <success> <error> (hex values in config.yml, style.palette)
# <type> is the colour of the boost type being shown (config.yml types.<id>.color)
# Bold is only used in bossbar titles
# Symbols: ✔ (success), ✘ (error), • (bullet), › (prefix), (!) — quantities are written x10
# One line per message, no exclamation marks, no trailing full stops
# A message set to '' is not sent
# Chat messages and bottles use the normal font. Small caps (config.yml style.small-caps) only applies to
# bossbar titles; tags are never converted
# Item lore: short lines (about 30 characters), long sentences go on the next line
# Colours are MiniMessage: <dark_gray>, <#33FD42>, <bold>... (legacy & codes are NOT supported)

# Prepended to every chat message, '' removes it
prefix: '<dark_gray>(</dark_gray><bold><#33FD42>B</#33FD42><#44F651>o</#44F651><#55EF60>x</#55EF60><#65E96F>P</#65E96F><#76E27E>v</#76E27E><#87DB8D>P</#87DB8D></bold><dark_gray>)</dark_gray> '

# Unit words for durations: 20 phút, 1 giờ 30 phút, 2 ngày 3 giờ, 45 giây
units:
  second: 'giây'
  minute: 'phút'
  hour: 'giờ'
  day: 'ngày'

# %click% in the bottle lore and the /booster guide, follows bottle.use-click in config.yml
click:
  right: 'Chuột phải'
  left: 'Chuột trái'

bottle:
  used: '<success>✔ Đã kích hoạt <type>Boost %type_name% x%multiplier% <muted>trong <text>%duration%'
  # the active bottle of the same type was deleted (its remaining time is lost). %old% %remaining% %multiplier%
  replaced: '<muted>Boost <type>%type_name% x%old%<muted> cũ (còn <text>%remaining%<muted>) đã được thay bằng <type>x%multiplier%'
  # same multiplier as the running bottle: its duration was added (Update 05). %added% %remaining% %multiplier%
  extended: '<success>Đã cộng thêm <text>%added% <success>vào <type>Boost %type_name% x%multiplier%<muted>, còn <text>%remaining%'
  # same multiplier but the running bottle is already at max-duration: refused, the bottle is kept. %max%
  full: '<error>Boost <type>%type_name% x%multiplier% <error>đã đạt thời gian tối đa <text>%max%<error>, chưa cộng thêm được'
  # lower multiplier than the running bottle: refused, the bottle is kept. %old% %remaining%
  refused-lower: '<error>Bạn đang dùng <type>Boost %type_name% x%old%<error>, chai x%multiplier% thấp hơn nên không dùng được'
  # Warnings: the bottle is only used if used again within %seconds% seconds (config.yml bottle.confirm-window-seconds)
  # Placeholders: %type_name% %multiplier% %duration% (this bottle), %old% (active bottle), %remaining% (its time left),
  #               %effective% (current multiplier), %after% (multiplier if this bottle were used now), %seconds%
  # same multiplier, the added time would go past max-duration: %lost% is dropped. %max% %lost%
  confirm-capped: '<accent>(!) Boost <type>%type_name% x%multiplier% <accent>chỉ cộng được tới tối đa <text>%max%<accent>, phần dư <text>%lost% <accent>sẽ mất. <muted>Sử dụng lại trong <text>%seconds% giây <muted>để xác nhận'
  # higher multiplier than the active bottle: replaces it, its remaining time is lost
  confirm-higher: '<accent>(!) Chai <type>x%multiplier% <accent>sẽ thay thế <type>Boost %type_name% x%old% <muted>(còn <text>%remaining%<muted>)<accent>, thời gian còn lại của chai cũ sẽ mất. <muted>Sử dụng lại trong <text>%seconds% giây <muted>để xác nhận'
  # no active bottle, but the rank, global or clan boost is already as high: consumed without effect
  confirm-no-effect: '<error>✘ Boost hiện tại của bạn là <text>x%effective%<error>, nếu sử dụng boost này bây giờ sẽ vô tác dụng. <muted>Sử dụng lại trong <text>%seconds% giây <muted>nếu vẫn muốn dùng'
  used-no-effect: '<muted>Đã sử dụng Boost %type_name% x%multiplier%, boost không có tác dụng'
  invalid: '<error>✘ Chai boost này không còn hợp lệ, hãy liên hệ quản trị viên'
  expired: '<muted>Boost <type>%type_name% x%multiplier% <muted>của bạn đã hết hạn'
  # Title shown on screen when the active bottle runs out, '' disables it. %type% %type_name% %multiplier%
  expired-title: '<type>Boost %type_name% x%multiplier% <text>đã hết!'
  expired-subtitle: ''
  gamemode: '<error>✘ Không thể dùng boost ở chế độ chơi này'

# Bottle item. Placeholders: %type% %type_name% %multiplier% %duration% %description% %click%
# Name and lore are display only, the plugin never reads them back
bottle-item:
  name: '<type>Boost %type_name% <dark_gray>[<#FFD166>x%multiplier%<dark_gray>]'
  lore:
    - '<#BFC7D5>%description%'
    - ''
    - '<#FFD166>Thông tin:'
    - '<gray>• Loại: <type>%type_name%'
    - '<gray>• Hệ số: <#FFD166>x%multiplier%'
    - '<gray>• Thời gian: <#7CFC9A>%duration%'
    - ''
    - '<#FFD166>Lưu ý:'
    - '<gray>• Cùng hệ số: cộng thời gian'
    - '<gray>• Hệ số thấp hơn: không dùng được'
    - '<gray>• Hướng dẫn: <#7FDBFF>/booster'
    - ''
    - '<dark_gray>[<#7CFC9A>%click% để kích hoạt<dark_gray>]'

# Clan bottle (Update 05): /boxcore give <player> <type> <multiplier> <duration> [amount] clan
# Only the Minh Chủ and the Phó Bang of a clan can use it; it boosts every member of their clan
clan-bottle-item:
  name: '<type>Boost %type_name% - Bang hội <dark_gray>[<#FFD166>x%multiplier%<dark_gray>]'
  lore:
    - '<#BFC7D5>%description%'
    - '<#BFC7D5>cho cả bang hội'
    - ''
    - '<#FFD166>Thông tin:'
    - '<gray>• Hệ số: <#FFD166>x%multiplier%'
    - '<gray>• Thời gian: <#7CFC9A>%duration%'
    - '<gray>• Vẫn tính giờ khi offline'
    - ''
    - '<#FFD166>Lưu ý:'
    - '<gray>• Không cộng với boost khác,'
    - '<gray>  nhận hệ số cao nhất'
    - '<gray>• Cùng hệ số: cộng thời gian'
    - '<gray>• Hệ số thấp hơn: không dùng được'
    - ''
    - '<#FF8A8A>Chỉ Minh Chủ, Phó Bang dùng được'
    - '<dark_gray>[<#7CFC9A>%click% để kích hoạt<dark_gray>]'

give:
  done: '<success>✔ Đã tặng <text>%amount% <type>Boost %type_name% x%multiplier% <muted>(%duration%) <success>cho <text>%player%'
  received: '<success>Bạn nhận được <text>%amount% <type>Boost %type_name% x%multiplier%'
  done-clan: '<success>✔ Đã tặng <text>%amount% <type>Boost %type_name% - Bang hội x%multiplier% <muted>(%duration%) <success>cho <text>%player%'
  received-clan: '<success>Bạn nhận được <text>%amount% <type>Boost %type_name% - Bang hội x%multiplier%'

# Clan boosts (Update 05). Sent to every online member of the clan unless noted.
# %player% who used it (staff-name for commands), %clan% the clan, %type_name% %multiplier% %duration%,
# %added% time added, %remaining% time left, %old% the replaced multiplier
clan:
  staff-name: 'Quản trị viên'
  started: '<accent>%player% <success>đã kích hoạt <type>Boost Bang hội %type_name% x%multiplier% <muted>trong <text>%duration%'
  extended: '<accent>%player% <success>đã cộng thêm <text>%added% <success>vào <type>Boost Bang hội %type_name% x%multiplier%<muted>, còn <text>%remaining%'
  replaced: '<accent>%player% <success>đã thay <type>Boost Bang hội %type_name% x%old% <success>bằng <type>x%multiplier% <muted>trong <text>%duration%'
  expired: '<muted>Boost Bang hội <type>%type_name% x%multiplier% <muted>đã hết hạn'
  stopped: '<muted>Boost Bang hội <type>%type_name% x%multiplier% <muted>đã bị dừng'
  # to the player using the bottle only. Warnings: %seconds% %old% %remaining% %max% %lost%
  confirm-replace: '<accent>(!) Chai <type>x%multiplier% <accent>sẽ thay <type>Boost Bang hội %type_name% x%old% <muted>(còn <text>%remaining%<muted>)<accent>, thời gian còn lại sẽ mất. <muted>Sử dụng lại trong <text>%seconds% giây <muted>để xác nhận'
  confirm-capped: '<accent>(!) Boost Bang hội <type>%type_name% x%multiplier% <accent>chỉ cộng được tới tối đa <text>%max%<accent>, phần dư <text>%lost% <accent>sẽ mất. <muted>Sử dụng lại trong <text>%seconds% giây <muted>để xác nhận'
  refused-lower: '<error>Bang hội đang có <type>Boost %type_name% x%old%<error>, chai x%multiplier% thấp hơn nên không dùng được'
  full: '<error>Boost Bang hội <type>%type_name% x%multiplier% <error>đã đạt thời gian tối đa <text>%max%'
  no-clan: '<error>Bạn chưa có bang hội nên không dùng được chai boost bang hội'
  not-allowed: '<error>Chỉ Minh Chủ và Phó Bang được dùng chai boost bang hội'
  unavailable: '<error>Boost bang hội chưa hoạt động trên server, hãy báo quản trị viên'

global:
  started: '<accent>Boost toàn server <type>%type_name% x%multiplier% <accent>đã bắt đầu trong <text>%duration%'
  # second line broadcast right after 'started' (also on replace), '' disables it
  no-stack-note: '<muted>Boost global không cộng dồn với multiple rank và booster cá nhân'
  replaced: '<muted>Đã thay boost toàn server %type_name% x%old% bằng x%multiplier%'
  stopped: '<muted>Boost toàn server %type_name% đã kết thúc'
  not-active: '<error>✘ Không có boost toàn server nào cho loại <text>%type%'

error:
  unknown-type: '<error>✘ Loại boost không tồn tại: <text>%type%'
  multiplier: '<error>✘ Bội số phải là số nguyên từ 2 đến %max%'
  # types with decimal: true (quest)
  multiplier-decimal: '<error>✘ Bội số phải từ 1.1 đến %max% (tối đa 1 chữ số thập phân, ví dụ 1.5)'
  duration: '<error>✘ Thời gian không hợp lệ, ví dụ: 30s, 10m, 1h30m (tối đa %max%)'
  player-offline: '<error>✘ Người chơi <text>%player% <error>không trực tuyến'
  amount: '<error>✘ Số lượng phải là số nguyên từ 1 đến 64'

command:
  usage: '<muted>Cách dùng: <text>%usage%'
  no-permission: '<error>✘ Bạn không có quyền làm điều này'
  error: '<error>✘ Đã xảy ra lỗi, thao tác đã bị hủy'

reload:
  done: '<success>✔ Đã tải lại BoxCore'
  failed: '<error>✘ Tải lại thất bại, xem console; cấu hình cũ được giữ nguyên'

# Bossbar titles. %remaining% is HH:MM:SS (>= 1 hour) or MM:SS
# Only the "Boost ... x..." part is bold; separators, time and suffixes are not
bossbar:
  global: '<bold><type>Boost toàn server %type_name% x%multiplier%</bold> <gray>| <aqua>%remaining%'
  personal: '<bold><type>Boost %type_name% x%multiplier%</bold> <gray>| <aqua>%remaining%'
  # appended when a global boost determines the effective value (global > rank + bottle)
  personal-suffix: ' <gray>| <muted>đang dùng <text>x%effective%'
  # appended when the bottle is stacked with a rank (and no higher global)
  personal-suffix-total: ' <gray>| <muted>tổng <text>x%effective%'
  # boost of the player's clan (Update 05), shown to every online member
  clan: '<bold><type>Boost Bang hội %type_name% x%multiplier%</bold> <gray>| <aqua>%remaining%'
  # appended when the player's own value (rank + bottle, or global) is higher than the clan boost
  clan-suffix: ' <gray>| <muted>đang dùng <text>x%effective%'

# /boxcore check <player> (admin, no prefix). %time% uses config.yml timezone
# rank = R (0 = none), bottle = B (0 = none), personal = max(R + B, 1),
# effective = min(max(personal, global, clan, 1) + bonus, max)   (bonus = pet of BoxPet, BoxCore 1.6.0)
check:
  header: '<accent>Boost của <text>%player%'
  type: '<muted>• <type>%type_name% <muted>(%type%) hiệu lực <accent>x%effective%'
  sum: '<muted>  • Rank <text>x%rank% <muted>+ chai <text>x%bottle% <muted>= cá nhân <text>x%personal%'
  global: '<muted>  • Global <text>x%multiplier% <muted>(còn <text>%remaining%<muted>, hết hạn %time%)'
  global-used: '<muted>  • Global <text>x%multiplier% <muted>(còn <text>%remaining%<muted>, hết hạn %time%) → <accent>đang dùng global'
  global-none: '<muted>  • Global: <text>không có'
  bottle: '<muted>  • Chai: <text>x%multiplier% <muted>còn <text>%remaining% <muted>(hết hạn %time%)'
  bottle-none: '<muted>  • Chai: <text>không có'
  clan: '<muted>  • Bang hội: <text>x%multiplier% <muted>còn <text>%remaining% <muted>(hết hạn %time%)'
  clan-used: '<muted>  • Bang hội: <text>x%multiplier% <muted>còn <text>%remaining% <muted>(hết hạn %time%) → <accent>đang dùng bang hội'
  clan-none: '<muted>  • Bang hội: <text>không có'
  # bonus P of plugins such as BoxPet (BoxCore 1.6.0): added on top of the source above that wins
  bonus: '<muted>  • Cộng thêm (pet): <text>+x%multiplier%'
  bonus-none: '<muted>  • Cộng thêm (pet): <text>không có'
  capped: '<muted>  • Giới hạn tối đa <text>x%max%'

# GEM currency. %gem% is the coloured gem name (config.yml gem.display-name and gem.color)
# Amounts are written 1.250 (grouped with '.')
# <gem> is the gem colour: amounts of gem use it too, so '1.250 Gem' is one colour
gem:
  balance: '<muted>Số dư: <gem>%amount% %gem%'
  # to the player on /boxcore gem give|take|set (not with -s)
  received: '<success>Bạn nhận được <gem>%amount% %gem%'
  taken: '<muted>Đã trừ <gem>%amount% %gem% <muted>khỏi tài khoản của bạn'
  set: '<muted>Số dư của bạn được đặt thành <gem>%amount% %gem%'
  admin:
    given: '<success>✔ Đã cộng <gem>%amount% %gem% <success>cho <text>%player% <muted>(số dư <gem>%balance%<muted>)'
    taken: '<success>✔ Đã trừ <gem>%amount% %gem% <success>của <text>%player% <muted>(số dư <gem>%balance%<muted>)'
    set: '<success>✔ Đã đặt số dư của <text>%player% <success>thành <gem>%amount% %gem%'
    insufficient: '<error>✘ <text>%player% <error>chỉ có <gem>%balance% %gem%'
    limit: '<error>✘ Số dư của <text>%player% <error>sẽ vượt quá tối đa <gem>%max% %gem%'
    # /boxcore gem check <player> (no prefix). %time% uses config.yml timezone
    check-header: '<accent>%gem% của %player% <muted>• <gem>%balance% %gem%'
    check-line: '<muted>%time% <gem>%delta% <muted>→ <gem>%balance% <muted>• %reason%'
    check-empty: '<muted>Chưa có giao dịch nào'
  pay:
    sent: '<success>✔ Đã chuyển <gem>%amount% %gem% <success>cho <text>%player%'
    received: '<success>Bạn nhận được <gem>%amount% %gem% <success>từ <text>%player%'
    insufficient: '<error>✘ Bạn không đủ %gem%<error>, số dư hiện tại: <gem>%balance% %gem%'
    self: '<error>✘ Không thể tự chuyển cho chính mình'
    min: '<error>✘ Số lượng tối thiểu là <gem>%min% %gem%'
    cooldown: '<error>✘ Vui lòng đợi <text>%seconds% giây <error>trước khi chuyển tiếp'
    target-full: '<error>✘ <text>%player% <error>đã đạt số dư tối đa'
  # /gem top (no prefix)
  top:
    header: '<accent>Bảng xếp hạng %gem%'
    line: '<muted>%rank%. <text>%player% <muted>• <gem>%amount% %gem%'
    updated: '<muted>Cập nhật %seconds% giây trước'
    empty: '<muted>Chưa có ai trong bảng xếp hạng'
    # %boxcore_gem_top_<n>_name% / _amount% when rank n is empty
    empty-name: '-'
    empty-amount: '0'
  not-loaded: '<error>✘ Dữ liệu %gem% chưa tải xong, thử lại sau giây lát'
  disabled: '<error>✘ %gem% đang tạm tắt, hãy báo quản trị viên'
  error:
    amount: '<error>✘ Số lượng phải là số nguyên từ 1 đến %max%'
    unknown-player: '<error>✘ Người chơi <text>%player% <error>chưa từng vào server'

# /booster guide (no prefix). %click% follows bottle.use-click
booster:
  guide:
    - ''
    - '<#FFD166><bold>Hướng dẫn Booster</bold>'
    - ''
